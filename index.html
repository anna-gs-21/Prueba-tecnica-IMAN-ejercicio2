<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <title>Formulario</title>
  </head>
  <body>
    <div>
      <h1>Registro de Usuario</h1>
      <form id="miFormulario" action="" method="POST">
        <button type="submit">Enviar y Ejecutar</button>
      </form>
    </div>
    <div id=response> </div>
    <script>
      document.getElementById('miFormulario').addEventListener('submit', async function(e) {
        e.preventDefault();

        const data = new FormData();
        data.append('action', 'create_user');
        data.append('name', 'XC90');
        data.append('email', 'test@example.com');
        
        const response = await fetch('controller.php', {
          method: 'POST',
          body: data
        });

        const responseDiv = document.getElementById('response');
        responseDiv.innerHTML = JSON.stringify(await response.json());
      });
    </script>
  </body>
</html>
